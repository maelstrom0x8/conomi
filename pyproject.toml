[project]
name = "conomi"
version = "0.1.0"
description = "Conomi: the fabric-allocation workflow's ledger and Switch tool surface."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "mcp==2.3.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "hypothesis==6.170.14",
    "ruff==0.17.3",
    "mypy==2.4.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# F = pyflakes, E/W = pycodestyle, I = isort, UP = pyupgrade, B = bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["conomi"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["conomi"]
